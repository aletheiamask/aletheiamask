name: candy blocks

on:
  schedule:
    - cron: "27 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d-settings.json
      - name: Commit
        run: |
          git config user.name "candy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh candy blocks"
          for try in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((try * 4))
          done
          exit 1
