name: candy snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/candy-snake.svg?color_snake=#e0607e&color_dots=#f3e2d3,#ffc4d6,#ff8fb1,#b8a4ff,#8fe3cf
            dist/candy-snake-dark.svg?palette=github-dark&color_snake=#8fe3cf&color_dots=#3d2847,#7a3f63,#c55a86,#ff8fb1,#ffc4d6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
